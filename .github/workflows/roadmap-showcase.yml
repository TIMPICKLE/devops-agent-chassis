name: Roadmap Showcase · Contracts and Portable Evidence

on:
  push:
    branches: ["feat/roadmap-**"]
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: "Run paid live model verification after contracts pass"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: roadmap-showcase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-matrix:
    name: Contracts and 2 payloads × 3 flows · Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core and optional model adapter tests
        run: python -m pip install -e ".[dev,llm]"
      - name: Install optional MCP transport tests
        if: matrix.python-version == '3.13'
        run: python -m pip install -e ".[mcp]" uvicorn
      - name: Run regression suite (no model keys)
        run: python -m pytest tests/ -q
      - name: Exercise the reuse matrix and validate portable reports
        shell: bash
        run: |
          for flow in nested state_machine single_agent; do
            python tools/run_roadmap_showcase.py --mode offline --flow "$flow" --output-dir "reports/roadmap-showcase/$flow"
            python tools/verify_roadmap_evidence.py "reports/roadmap-showcase/$flow"
          done
      - name: Publish clearly labelled offline summaries
        if: always()
        shell: bash
        run: |
          for flow in nested state_machine single_agent; do
            summary="reports/roadmap-showcase/$flow/summary.md"
            if [[ -f "$summary" ]]; then
              printf '\n## %s\n\n' "$flow" >> "$GITHUB_STEP_SUMMARY"
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Run and verify the offline context experiment
        run: |
          python tools/run_context_experiment.py --mode offline --output-dir reports/roadmap-showcase/context-experiment
          python tools/verify_context_experiment.py reports/roadmap-showcase/context-experiment
      - name: Publish context experiment overview
        if: always()
        run: |
          if [[ -f reports/roadmap-showcase/context-experiment/summary.md ]]; then
            cat reports/roadmap-showcase/context-experiment/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload contracts, patches and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: roadmap-contracts-py${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/roadmap-showcase/
          if-no-files-found: warn
          retention-days: 14

  live-runtime:
    needs: contract-matrix
    if: >-
      github.repository == 'TIMPICKLE/devops-agent-chassis' &&
      ((github.event_name == 'workflow_dispatch' && inputs.live) ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[roadmap-live]')))
    name: Explicit opt-in · protocol swap and context experiment
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install reference model adapter
        run: python -m pip install -e ".[llm]"
      - name: Run real Anthropic decisions and independent validators (at most 8 requests)
        env:
          BIGMODEL_API_KEY: ${{ secrets.BIGMODEL_API_KEY }}
          ANTHROPIC_BASE_URL: https://open.bigmodel.cn/api/anthropic
          ANTHROPIC_MODEL: glm-5.3-flash
        run: >-
          python tools/run_roadmap_showcase.py --mode live --protocol anthropic --max-calls 4
          --output-dir reports/roadmap-showcase-live/anthropic
      - name: Run real OpenAI-compatible decisions (at most 8 requests)
        if: ${{ !cancelled() }}
        env:
          BIGMODEL_API_KEY: ${{ secrets.BIGMODEL_API_KEY }}
        run: >-
          python tools/run_roadmap_showcase.py --mode live --protocol openai --max-calls 4
          --model glm-5.3-flash --base-url https://open.bigmodel.cn/api/coding/paas/v4
          --output-dir reports/roadmap-showcase-live/openai
      - name: Run real context experiment (six trials, at most 24 requests)
        if: ${{ !cancelled() }}
        env:
          BIGMODEL_API_KEY: ${{ secrets.BIGMODEL_API_KEY }}
        run: >-
          python tools/run_context_experiment.py --mode live --protocol anthropic
          --model glm-5.3-flash --base-url https://open.bigmodel.cn/api/anthropic
          --max-calls 4 --max-total-model-calls 24 --seed 42 --repeats 1
          --output-dir reports/roadmap-showcase-live/context-experiment
      - name: Validate both protocol evidence contracts
        if: always()
        run: |
          python tools/verify_roadmap_evidence.py reports/roadmap-showcase-live/anthropic --require-live
          python tools/verify_roadmap_evidence.py reports/roadmap-showcase-live/openai --require-live
      - name: Recompute live experiment totals from evidence
        if: always()
        run: python tools/verify_context_experiment.py reports/roadmap-showcase-live/context-experiment --require-live
      - name: Publish runtime summary
        if: always()
        shell: bash
        run: |
          for part in anthropic openai context-experiment; do
            summary="reports/roadmap-showcase-live/$part/summary.md"
            printf '\n## %s\n\n' "$part" >> "$GITHUB_STEP_SUMMARY"
            if [[ -f "$summary" ]]; then
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Runtime evidence missing for $part; check the run logs." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: roadmap-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/roadmap-showcase-live/
          if-no-files-found: warn
          retention-days: 14
