[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-chassis"
version = "0.1.0"
description = "DevOps 数字员工工程底盘：可插拔的编排、接入、知识注入、失败契约与可观测"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TIMPICKLE" }]
keywords = ["agent", "devops", "orchestration", "mcp", "chassis"]

# 底盘本体零依赖，只用标准库。
# MCP Python SDK v2 需要 Python 3.10+；接真实 MCP server 时按需安装：
#   pip install "agent-chassis[mcp]"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.1,<3"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/TIMPICKLE/devops-agent-chassis"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
